name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apresentacao.html
      - apresentacao.css
      - apresentacao.js
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        run: |
          mkdir _site
          cp apresentacao.html _site/apresentacao.html
          cp apresentacao.html _site/index.html
          cp apresentacao.css apresentacao.js _site/

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@v4
